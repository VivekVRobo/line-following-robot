[platformio]
default_envs = uno
test_dir = test

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wshadow
  -Wconversion

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=c++17
  -Iinclude
  -Wall
  -Wextra
  -Wshadow
  -Wconversion
  -Werror
test_filter = test_control, test_line_estimator, test_recovery
