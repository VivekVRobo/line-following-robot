name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  firmware-and-native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio
      - name: Build Arduino Uno firmware
        run: pio run -e uno
      - name: Run native control tests
        run: pio test -e native
  python-tooling-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m compileall -q tools
      - run: python -m unittest discover -s tools/tests -v
      - name: Run deterministic simulator smoke
        run: python tools/simulate.py --seconds 0.5 --output artifacts/simulation.csv --summary artifacts/simulation-summary.json
      - run: python tools/calibrate_sensors.py examples/sample_calibration.csv
      - run: python tools/analyze_telemetry.py examples/sample_telemetry.log --markdown
      - name: Run 20-scenario corrected-model regression gate
        run: python tools/regression_suite.py --seconds 8 --output artifacts/regression.json
      - name: Run 243-scenario software robustness characterization
        run: python tools/robustness_sweep.py --seconds 2 --output artifacts/robustness-sweep.json
      - name: Verify simulation claim boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          simulation = json.loads(Path('artifacts/simulation-summary.json').read_text())
          regression = json.loads(Path('artifacts/regression.json').read_text())
          robustness = json.loads(Path('artifacts/robustness-sweep.json').read_text())
          assert simulation['simulator_model_version'] == 2
          assert simulation['physical_evidence'] is False
          assert simulation['physics_validated'] is False
          assert regression['simulator_model_version'] == 2
          assert regression['passed'] is True
          assert regression['physical_evidence'] is False
          assert robustness['scenario_count'] == 243
          assert robustness['physical_evidence'] is False
          assert robustness['physics_validated'] is False
          print('simulation evidence boundaries: PASS')
          PY
      - name: Upload deterministic software evidence
        uses: actions/upload-artifact@v4
        with:
          name: line-follower-software-evidence
          path: artifacts/
          if-no-files-found: error
